contract:
  name: nyc_taxi_silver
  version: v1

table:
  catalog: ifood_case
  schema: silver
  name: yellow_taxi_trips
  owner: marinabpassos@gmail.com

grain:
  statement: "Uma linha = um evento de corrida (uma corrida de yellow táxi)."
  uniqueness_note: >
    Nenhuma restrição formal de unicidade (chave primária) é imposta
    apenas sobre este schema de 6 colunas. Duas corridas distintas
    poderiam, por coincidência, ter valores idênticos nas 6 colunas. A
    única garantia de unicidade herdada vem do dedup de linha completa da
    camada bronze sobre suas 19 colunas de origem (feature 004) -- uma
    checagem mais forte do que qualquer coisa re-derivável do schema mais
    estreito da silver.

columns:
  - name: VendorID
    type: integer
    nullable: false
    description: >
      Identifica o provedor TPEP que forneceu o registro da corrida (o
      fornecedor da tecnologia de despacho/medição do táxi, não um táxi
      ou motorista individual).
  - name: passenger_count
    type: integer
    nullable: false
    description: >
      Número de passageiros no veículo durante a corrida, conforme
      informado pelo motorista. Linhas com contagem de passageiros nula
      ou zero são descartadas antes de chegar à silver (ver
      quality_rules), então toda linha aqui tem contagem positiva.
  - name: total_amount
    type: decimal
    nullable: false
    description: >
      Valor total cobrado do passageiro, incluindo tarifa, taxas,
      pedágios e sobretaxas. Linhas com valor negativo ou zero são
      descartadas antes de chegar à silver (ver quality_rules), então
      toda linha aqui é uma cobrança positiva genuína.
  - name: tpep_pickup_datetime
    type: timestamp
    nullable: false
    description: >
      Data e hora em que o taxímetro foi acionado (início da corrida).
      Garantida dentro do intervalo de 1 de jan a 31 de mai de 2023 e
      anterior a tpep_dropoff_datetime (ver quality_rules).
  - name: tpep_dropoff_datetime
    type: timestamp
    nullable: false
    description: >
      Data e hora em que o taxímetro foi desligado (fim da corrida).
      Garantida dentro do intervalo de 1 de jan a 31 de mai de 2023 e
      posterior a tpep_pickup_datetime (ver quality_rules).
  - name: _silver_processed_at
    type: timestamp
    nullable: false
    description: >
      Timestamp em que esta linha foi escrita pelo pipeline de ingestão
      da silver (feature 006). Coluna de auditoria própria da silver --
      não herdada de _source_file/_ingested_at da bronze, ambas
      descartadas (esclarecimento de 2026-07-23).

quality_rules:
  - id: total_amount_negative_or_zero
    condition: "total_amount <= 0"
    policy: drop
    counting: independent
    rationale: >
      Um total_amount negativo ou zero não pode representar uma tarifa
      real cobrada de um passageiro; manter essas linhas enviesaria para
      baixo a primeira pergunta analítica do case (média de total_amount
      por mês), com valores que não refletem a receita genuína da frota.
  - id: passenger_count_null_or_zero
    condition: "passenger_count IS NULL OR passenger_count = 0"
    policy: drop
    counting: independent
    rationale: >
      Uma corrida de táxi com zero passageiros ou passageiros
      desconhecidos é um defeito de entrada de dados, não uma corrida
      válida; manter essas linhas enviesaria a segunda pergunta analítica
      do case (média de passageiros por hora) para uma contagem
      artificialmente baixa.
  - id: dropoff_before_pickup
    condition: "tpep_dropoff_datetime < tpep_pickup_datetime"
    policy: drop
    counting: independent
    rationale: >
      Uma corrida que termina antes de começar é fisicamente impossível e
      indica um erro de registro de timestamp, não uma duração real de
      corrida.
  - id: out_of_range_dates
    condition: "tpep_pickup_datetime < '2023-01-01' OR tpep_dropoff_datetime >= '2023-06-01'"
    policy: drop
    counting: independent
    rationale: >
      O escopo deste case é exatamente Jan-Mai 2023; registros que vazam
      de períodos adjacentes estão fora da janela de análise e
      distorceriam as duas perguntas analíticas se incluídos.
  - id: duplicates
    policy: resolved_upstream
    rationale: >
      Duplicatas de linha completa já são removidas durante a ingestão
      da bronze (feature 004, 0 encontradas nos 5 meses) -- a silver
      herda um input livre de duplicatas e não precisa de nenhuma lógica
      de dedup própria.

total_dropped_metric_note: >
  "Total de linhas descartadas" (linhas que falham em pelo menos uma das
  quatro regras de drop acima, contadas uma vez cada via OR lógico, sem
  dupla contagem) é uma métrica separada das quatro contagens
  independentes por regra acima, que podem se sobrepor quando uma linha
  falha em mais de uma regra simultaneamente (esclarecimento de
  2026-07-23). A feature 006 DEVE reportar as duas.

sla:
  frequency: monthly
  latency_target: "Em até 24 horas após o fechamento do mês"
  note: >
    Apenas ilustrativo -- a carga real deste projeto é um único lote
    histórico cobrindo Jan-Mai 2023, não um pipeline recorrente. Esta
    seção documenta a cadência que o pipeline seguiria se fosse operado
    de forma contínua.

versioning:
  current_version: v1
  breaking_change_policy:
    major: >
      Remover ou renomear uma coluna, estreitar o tipo de uma coluna ou
      mudar a política de uma regra de qualidade (ex.: drop -> keep) exige
      uma nova versão MAJOR.
    minor: >
      Adicionar uma nova coluna opcional exige uma nova versão MINOR.
    patch: >
      Edições apenas de redação ou descrição (sem mudança de schema ou
      regra) exigem apenas uma nova versão PATCH.
