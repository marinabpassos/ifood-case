contract:
  name: nyc_taxi_silver
  version: v1

table:
  catalog: ifood_case
  schema: silver
  name: yellow_taxi_trips
  owner: marinabpassos@gmail.com

grain:
  statement: "One row = one trip event (one yellow taxi ride)."
  uniqueness_note: >
    No formal uniqueness constraint (primary key) is enforced on this
    6-column schema alone. Two distinct trips could coincidentally share
    identical values across all 6 columns. The only inherited uniqueness
    guarantee comes from the bronze layer's full-row dedup over its 19
    source columns (feature 004) -- a stronger check than anything
    re-derivable from silver's narrower schema.

columns:
  - name: VendorID
    type: integer
    nullable: false
    description: >
      Identifies the TPEP provider that supplied the trip record (the
      taxi's dispatch/metering technology vendor, not an individual taxi
      or driver).
  - name: passenger_count
    type: integer
    nullable: false
    description: >
      Number of passengers in the vehicle for the trip, as reported by
      the driver. Rows with a null or zero passenger count are dropped
      before reaching silver (see quality_rules), so every row here has
      a positive count.
  - name: total_amount
    type: decimal
    nullable: false
    description: >
      Total amount charged to the passenger, including fare, taxes,
      tolls, and surcharges. Rows with a negative or zero amount are
      dropped before reaching silver (see quality_rules), so every row
      here is a genuine positive charge.
  - name: tpep_pickup_datetime
    type: timestamp
    nullable: false
    description: >
      Date and time the meter was engaged (trip start). Guaranteed to
      fall within Jan 1 - May 31, 2023 and to be before
      tpep_dropoff_datetime (see quality_rules).
  - name: tpep_dropoff_datetime
    type: timestamp
    nullable: false
    description: >
      Date and time the meter was disengaged (trip end). Guaranteed to
      fall within Jan 1 - May 31, 2023 and to be after
      tpep_pickup_datetime (see quality_rules).
  - name: _silver_processed_at
    type: timestamp
    nullable: false
    description: >
      Timestamp this row was written by the silver ingestion pipeline
      (feature 006). Silver's own audit column -- not inherited from
      bronze's _source_file/_ingested_at, both of which are dropped
      (2026-07-23 clarification).

quality_rules:
  - id: total_amount_negative_or_zero
    condition: "total_amount <= 0"
    policy: drop
    counting: independent
    rationale: >
      A negative or zero total_amount cannot represent a real fare
      charged to a passenger; keeping these rows would bias the case's
      first analytical question (average total_amount per month)
      downward with values that don't reflect genuine fleet revenue.
  - id: passenger_count_null_or_zero
    condition: "passenger_count IS NULL OR passenger_count = 0"
    policy: drop
    counting: independent
    rationale: >
      A taxi trip with zero or unknown passengers is a data-entry
      defect, not a valid ride; keeping these rows would bias the case's
      second analytical question (average passengers by hour) toward an
      artificially low count.
  - id: dropoff_before_pickup
    condition: "tpep_dropoff_datetime < tpep_pickup_datetime"
    policy: drop
    counting: independent
    rationale: >
      A trip that ends before it starts is physically impossible and
      indicates a timestamp recording error, not a real ride duration.
  - id: out_of_range_dates
    condition: "tpep_pickup_datetime < '2023-01-01' OR tpep_dropoff_datetime >= '2023-06-01'"
    policy: drop
    counting: independent
    rationale: >
      This case's scope is exactly Jan-May 2023; records that leak in
      from adjacent periods are outside the analysis window and would
      distort both analytical questions if included.
  - id: duplicates
    policy: resolved_upstream
    rationale: >
      Full-row duplicates are already removed during bronze ingestion
      (feature 004, 0 found across all 5 months) -- silver inherits a
      duplicate-free input and requires no additional dedup logic of its
      own.

total_dropped_metric_note: >
  "Total rows dropped" (rows failing at least one of the four drop rules
  above, counted once each via logical OR, no double-counting) is a
  separate metric from the four independent per-rule counts above, which
  may overlap when a row fails more than one rule simultaneously
  (2026-07-23 clarification). Feature 006 MUST report both.

sla:
  frequency: monthly
  latency_target: "Within 24 hours of month close"
  note: >
    Illustrative only -- this project's actual load is a single
    historical batch covering Jan-May 2023, not a recurring pipeline.
    This section documents the cadence the pipeline would follow if it
    were operated on an ongoing basis.

versioning:
  current_version: v1
  breaking_change_policy:
    major: >
      Removing or renaming a column, narrowing a column's type, or
      changing a data-quality rule's policy (e.g. drop -> keep) requires
      a new MAJOR version.
    minor: >
      Adding a new optional column requires a new MINOR version.
    patch: >
      Wording or description-only edits (no schema or rule change)
      require only a new PATCH version.
